name: Start ComfyUI Server
description: 'Prepare and start ComfyUI in a Playwright or prebuilt ComfyUI container'

inputs:
  front_end_root:
    description: 'Path to frontend dist directory'
    required: false
    default: '$GITHUB_WORKSPACE/dist'
  timeout:
    description: 'Timeout in seconds for server startup'
    required: false
    default: '600'

runs:
  using: 'composite'
  steps:
    - name: Install ComfyUI when using the public Playwright image
      shell: bash
      run: |
        set -euo pipefail
        if [ ! -d /ComfyUI ]; then
          apt-get update
          apt-get install -y --no-install-recommends \
            git python3-venv fonts-dejavu-core fonts-noto-core fonts-noto-cjk fonts-ubuntu
          git clone --depth 1 --branch v0.30.0 https://github.com/Comfy-Org/ComfyUI.git /ComfyUI
          python3 -m venv /opt/venv
          /opt/venv/bin/pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          /opt/venv/bin/pip install -r /ComfyUI/requirements.txt wait-for-it
          mkdir -p /ComfyUI/custom_nodes/ComfyUI_devtools
        fi
        echo /opt/venv/bin >> "$GITHUB_PATH"
        echo VIRTUAL_ENV=/opt/venv >> "$GITHUB_ENV"

    - name: Copy devtools and start server
      shell: bash
      run: |
        set -euo pipefail
        cp -r ./tools/devtools/* /ComfyUI/custom_nodes/ComfyUI_devtools/
        cd /ComfyUI && python3 main.py --cpu --multi-user --front-end-root "${{ inputs.front_end_root }}" &
        wait-for-it --service 127.0.0.1:8188 -t ${{ inputs.timeout }}
